[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloistr-backend"
version = "0.1.0"
description = "FastAPI + MongoDB backend scaffold for Cloistr"
requires-python = ">=3.12,<4.0"
dependencies = [
  "fastapi>=0.137.1,<1.0",
  "uvicorn[standard]>=0.52.4,<1.0",
  "pydantic-settings>=2.14.1,<3.0",
  "beanie>=1.29,<2.0",
  "motor>=3.7,<4.0",
  "pymongo>=4.17.0,<5.0",
  "python-multipart>=0.0.32,<1.0",
  "Pillow>=11,<12",
  "apscheduler>=3.11,<4.0",
  "pwdlib[argon2,bcrypt] (>=0.3.0,<0.4.0)",
  "authlib (>=1.7.2,<2.0.0)",
  "httpx (>=0.28.1,<0.29.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28,<1.0"
pytest = ">=9.1.0,<10.0"
pytest-asyncio = ">=1.4.0,<2.0"
ruff = ">=0.15.17,<1.0"
pytest-cov = "^7.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
